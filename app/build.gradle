plugins {
    id 'com.android.application'
}

android {
    namespace 'com.system.updater' // <-- WAJIB DIGANTI
    compileSdk 34

    defaultConfig {
        applicationId "com.system.updater" // <-- WAJIB DIGANTI
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
